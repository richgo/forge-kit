name: APMX software factory with SageKit

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Reviewed project directory relative to this checkout
        default: examples/consumers/python-api
        type: string
      promote:
        description: Publish the reviewed change to SageKit after independent replay
        default: false
        type: boolean

permissions: {}

jobs:
  pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'sagekit @ git+https://github.com/richgo/sage-kit.git@7d46bb65058431e9bd26591159bfec895c65445f'
      - name: Pin approved inputs and check requirements
        env:
          PROJECT_WORKSPACE: ${{ inputs.workspace }}
          PROMOTE: ${{ inputs.promote }}
          SAGEKIT_REMOTE_URL: ${{ vars.SAGEKIT_REMOTE_URL }}
          SAGEKIT_TOKEN: ${{ secrets.SAGEKIT_READ_TOKEN }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PROMOTE" == true ]]; then flags+=(--promote); fi
          python factory/sagekit_bridge.py prepare --workspace "$PROJECT_WORKSPACE" \
            --output "$RUNNER_TEMP/sagekit-state" --require-remote "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sagekit-state
          path: ${{ runner.temp }}/sagekit-state
          if-no-files-found: ignore

  factory:
    needs: pin
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: ${{ inputs.workspace }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  verified:
    needs: [pin, factory]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'sagekit @ git+https://github.com/richgo/sage-kit.git@7d46bb65058431e9bd26591159bfec895c65445f'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sagekit-state
          path: ${{ runner.temp }}/sagekit-state
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: apmx-receipt
          path: ${{ runner.temp }}/apmx-receipt
      - name: Check release context against the independently verified receipt
        env:
          PROJECT_WORKSPACE: ${{ inputs.workspace }}
          PROMOTE: ${{ inputs.promote }}
          RECEIPT_SHA256: ${{ needs.factory.outputs.receipt-sha256 }}
          SAGEKIT_REMOTE_URL: ${{ vars.SAGEKIT_REMOTE_URL }}
          SAGEKIT_TOKEN: ${{ secrets.SAGEKIT_READ_TOKEN }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PROMOTE" == true ]]; then flags+=(--promote); fi
          python factory/sagekit_bridge.py complete --workspace "$PROJECT_WORKSPACE" \
            --state "$RUNNER_TEMP/sagekit-state" --output "$RUNNER_TEMP/sagekit-result" \
            --receipt "$RUNNER_TEMP/apmx-receipt/receipt.intoto.jsonl" \
            --receipt-sha256 "$RECEIPT_SHA256" --require-remote "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sagekit-release-gate
          path: ${{ runner.temp }}/sagekit-result/release.json
          if-no-files-found: ignore
      - if: inputs.promote
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/sagekit-result/promotion.json
      - if: inputs.promote
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sagekit-verified-promotion
          path: ${{ runner.temp }}/sagekit-result/promotion.json
          if-no-files-found: error

  promote:
    needs: verified
    if: inputs.promote
    uses: richgo/sage-kit/.github/workflows/promote.yml@7d46bb65058431e9bd26591159bfec895c65445f
    permissions:
      actions: read
      contents: read
      attestations: read
