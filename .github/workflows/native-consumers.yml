name: Qualify native consumer acceptance
on:
  pull_request:
    paths:
      - 'examples/consumers/**'
      - 'scripts/qualify-native-consumers.sh'
      - '.github/workflows/native-consumers.yml'
  push:
    branches: [main]
    paths:
      - 'examples/consumers/**'
      - 'scripts/qualify-native-consumers.sh'
      - '.github/workflows/native-consumers.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.9.3
      - name: Exercise source acceptance and malicious patch rejection
        run: bash scripts/qualify-native-consumers.sh
