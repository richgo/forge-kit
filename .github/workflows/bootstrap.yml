name: Factory bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages_drill:
        description: Publish and recover the synthetic release in a separate test repository
        type: boolean
        default: false
      pages_restore_only:
        description: With pages_drill enabled, publish only the verified baseline
        type: boolean
        default: false
      jev_probe:
        description: Run a live Jev decision on a synthetic repair case
        type: boolean
        default: false

      agent_products:
        description: Run the historical Phase 2/3 agent delivery qualification
        type: boolean
        default: false

      agent_replay_drill:
        description: Authenticate and replay the archived Phase 2 source in the resume drill
        type: boolean
        default: false
      agent_resume_drill:
        description: Interrupt agent delivery once after the initial checkpoint
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agent-products:
    if: github.event_name == 'workflow_dispatch' && inputs.agent_products && (github.ref == 'refs/heads/main' || github.actor == github.repository_owner)
    uses: ./.github/workflows/agent-delivery.yml
    with:
      resume_drill: ${{ inputs.agent_resume_drill }}
      replay_drill: ${{ inputs.agent_replay_drill }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      FORGE_JEV_TOKEN: ${{ secrets.FORGE_JEV_TOKEN }}

  website-preview:
    name: Preview Trail Desk architecture and website changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the pinned architecture planner
        id: architecture-package
        run: |
          set -euo pipefail
          ref="$(node factory/cli.mjs assemble | jq -er '.packages.architecture')"
          [[ "$ref" =~ ^richgo/forge-kit-skills/packages/architecture#[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${ref##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.architecture-package.outputs.sha }}
          path: _architecture
          persist-credentials: false
      - name: Generate both revisions from their tracked requirements
        env:
          FORGE_ARCHITECTURE_PACKAGE: _architecture/packages/architecture
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          current=examples/trail-desk/current/product-requirements.json
          if [[ ! -f "$current" ]]; then
            if git cat-file -e "$BASE_SHA:$current" 2>/dev/null; then
              echo '::error::The active Trail Desk product requirements were removed.'
              exit 1
            fi
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/website-base" "$BASE_SHA"
          base="$RUNNER_TEMP/website-base"
          prior="$base/$current"
          if [[ ! -f "$prior" ]]; then prior="$base/examples/trail-desk/step-free/product-requirements.json"; fi
          mkdir website-preview
          node "$base/factory/website.mjs" build "$prior" website-preview/before
          node factory/website.mjs build "$current" website-preview/after
          node factory/impact.mjs \
            --before-requirements "$prior" --before-calm website-preview/before/architecture.json --before-likec4 website-preview/before/architecture.c4 \
            --after-requirements "$current" --after-calm website-preview/after/architecture.json --after-likec4 website-preview/after/architecture.c4 \
            > website-preview/impact.json
          node factory/impact.mjs \
            --before-requirements "$base/examples/product-requirements.json" --before-calm "$base/architecture/slice.json" --before-likec4 "$base/architecture/slice.c4" \
            --after-requirements examples/product-requirements.json --after-calm architecture/slice.json --after-likec4 architecture/slice.c4 \
            > website-preview/readiness-impact.json
          for file in product-requirements.json architecture.json architecture.c4 index.html; do
            status=0
            git diff --no-index -- "website-preview/before/$file" "website-preview/after/$file" > "website-preview/$file.diff" || status=$?
            [[ "$status" -le 1 ]]
          done
      - name: Validate the planned CALM and LikeC4 snapshots with the native tools
        run: |
          set -euo pipefail
          [[ -d website-preview/after ]] || exit 0
          for snapshot in website-preview/before website-preview/after; do
            npx --yes --package @finos/calm-cli@1.68.0 calm validate --strict -a "$snapshot/architecture.json"
            npx --yes --package likec4@1.60.0 likec4 validate "$snapshot"
          done
          bash factory/test/native-architecture.sh
          npx --yes --package likec4@1.60.0 likec4 validate architecture
      - name: Resolve the independent website security package
        id: website-security
        run: |
          set -euo pipefail
          ref="$(node factory/cli.mjs assemble | jq -er '.packages.securityReview')"
          [[ "$ref" =~ ^richgo/forge-kit-skills/packages/security-review#[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${ref##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.website-security.outputs.sha }}
          path: _security
          persist-credentials: false
      - name: Replay Trail Desk acceptance in Chromium
        run: |
          set -euo pipefail
          [[ -d website-preview/after ]] || exit 0
          npm install --prefix "$RUNNER_TEMP/website-browser" --no-fund --no-audit playwright@1.56.1
          "$RUNNER_TEMP/website-browser/node_modules/.bin/playwright" install chromium
          export FORGE_PLAYWRIGHT="$RUNNER_TEMP/website-browser/node_modules/playwright/index.mjs"
          export FORGE_SECURITY_PACKAGE="_security/packages/security-review"
          node factory/website.mjs verify examples/trail-desk/current/product-requirements.json website-preview/after > website-preview/browser-evidence.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trail-desk-pr-preview
          path: website-preview/
          if-no-files-found: ignore

  decision:
    if: github.event_name == 'workflow_dispatch' && inputs.jev_probe && (github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF || github.actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the pinned repair decision policy
        id: decision-package
        run: |
          set -euo pipefail
          ref="$(node factory/cli.mjs assemble | jq -er '.packages.repairChecking')"
          [[ "$ref" =~ ^richgo/forge-kit-skills/packages/repair-acceptance#[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${ref##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.decision-package.outputs.sha }}
          path: _decisions
          persist-credentials: false
      - run: echo "FORGE_DECISION_PACKAGE=$GITHUB_WORKSPACE/_decisions/packages/repair-acceptance" >> "$GITHUB_ENV"
      - name: Exercise live Jev repair routing
        env:
          FORGE_JEV_TOKEN: ${{ secrets.FORGE_JEV_TOKEN }}
        run: node evals/jev-live.mjs > "$RUNNER_TEMP/jev-repair.json"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: ${{ !cancelled() }}
        with:
          repository: richgo/forge-kit-skills
          ref: 0c4751fd793149121d55be57fde1f0534aa9710e
          path: _runtime_advisor
          persist-credentials: false
      - name: Exercise live typed runtime advice with synthetic input
        if: ${{ !cancelled() }}
        env:
          FORGE_RUNTIME_ADVISOR: ${{ github.workspace }}/_runtime_advisor/packages/repair-acceptance/checks/jev.mjs
          FORGE_JEV_TOKEN: ${{ secrets.FORGE_JEV_TOKEN }}
        run: node evals/jev-runtime-live.mjs > "$RUNNER_TEMP/jev-runtime.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: live-jev-repair
          path: |
            ${{ runner.temp }}/jev-repair.json
            ${{ runner.temp }}/jev-runtime.json
          if-no-files-found: error

  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require an isolated repository for Pages drills
        if: github.event_name == 'workflow_dispatch' && inputs.pages_drill && github.repository == 'richgo/forge-kit'
        run: |
          echo '::error::Pages drills require a separate test repository. Use Forge Factory E2E for Trail Desk publication.'
          exit 1
      - id: catalog
        name: Resolve the delivery package revision
        run: |
          set -euo pipefail
          pin="$(node factory/cli.mjs assemble | jq -er '.packages.delivery | split("#")[1]')"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          printf 'pin=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.catalog.outputs.pin }}
          path: _catalog
          persist-credentials: false
      - id: requirements
        run: |
          set -euo pipefail
          pin="$(node factory/cli.mjs assemble | jq -er '.packages.skills | split("#")[1]')"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          printf 'pin=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.requirements.outputs.pin }}
          path: _requirements
          persist-credentials: false
      - name: Resolve the pinned architecture planner
        id: architecture-package
        run: |
          set -euo pipefail
          ref="$(node factory/cli.mjs assemble | jq -er '.packages.architecture')"
          [[ "$ref" =~ ^richgo/forge-kit-skills/packages/architecture#[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${ref##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.architecture-package.outputs.sha }}
          path: _architecture
          persist-credentials: false
      - name: Resolve the pinned repair decision policy
        id: decision-package
        run: |
          set -euo pipefail
          ref="$(node factory/cli.mjs assemble | jq -er '.packages.repairChecking')"
          [[ "$ref" =~ ^richgo/forge-kit-skills/packages/repair-acceptance#[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${ref##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.decision-package.outputs.sha }}
          path: _decisions
          persist-credentials: false
      - run: echo "FORGE_DECISION_PACKAGE=$GITHUB_WORKSPACE/_decisions/packages/repair-acceptance" >> "$GITHUB_ENV"
      - name: Restore the audited delivery capability from the frozen lock
        run: bash factory/restore-capabilities.sh
      - run: node --test test/*.test.mjs
      - name: Run adversarial cases in the pinned real container
        run: |
          set -euo pipefail
          image="$(node --input-type=module -e 'import {runtimeImages} from "./factory/agent-verifier.mjs"; console.log(runtimeImages.node)')"
          docker pull "$image"
          FORGE_TEST_CONTAINER=1 node --test test/agent-verifier.test.mjs test/phase-four-adversarial.test.mjs
        env:
          FORGE_ARCHITECTURE_PACKAGE: _architecture/packages/architecture
      - name: Trace a product story through repair and independent acceptance
        env:
          FORGE_REQUIREMENTS_PACKAGE: _requirements/packages/requirements
        run: |
          node --test _requirements/test/product-requirements.test.mjs evals/requirements-scenarios.mjs
          mkdir -p out
          inputs="$(mktemp -d)"
          cp examples/product-requirements.json test/fixtures/delegated/architecture.json test/fixtures/delegated/architecture.c4 "$inputs/"
          node factory/cli.mjs run out/story --inputs "$inputs" --story STORY-001 --fault wrong-output-once
          cp examples/pages-candidate/product-requirements.json "$inputs/"
          node factory/cli.mjs run out/pages-candidate --inputs "$inputs" --story STORY-001
      - name: Check signed evidence, rollback, and the pinned catalog's lifecycle
        env:
          FORGE_CATALOG_DIR: _catalog
        run: |
          node --test _catalog/test/*.mjs
          node --test evals/catalog-scenarios.mjs
      - name: Reproduce the frozen install and reject package tampering
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/microsoft/apm/releases/assets/606234092?download=1' -o "$scratch/apm.tar.gz"
          printf '%s  %s\n' 'e6374402c74318f7c8bef97a90d8572d049fdab0dc3871492c6b0647ae9e881f' "$scratch/apm.tar.gz" | sha256sum --check
          tar -xzf "$scratch/apm.tar.gz" -C "$scratch"
          apm="$(find "$scratch" -type f -name apm -print -quit)"
          bash factory/test/apm-integrity.sh "$apm"
      - name: Exercise clean and repaired builds
        run: |
          mkdir -p out
          node factory/cli.mjs run out/clean
          node factory/cli.mjs run out/repaired --faulty-first-build
          inputs="$(mktemp -d)"
          cp examples/requirements.json test/fixtures/delegated/architecture.json test/fixtures/delegated/architecture.c4 "$inputs/"
          node factory/cli.mjs run out/delegated --inputs "$inputs" --fault wrong-output-once
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bootstrap-delivery
          path: out/
          if-no-files-found: error
          retention-days: 7

  check:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the pinned repair decision policy
        id: decision-package
        run: |
          set -euo pipefail
          ref="$(node factory/cli.mjs assemble | jq -er '.packages.repairChecking')"
          [[ "$ref" =~ ^richgo/forge-kit-skills/packages/repair-acceptance#[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "${ref##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.decision-package.outputs.sha }}
          path: _decisions
          persist-credentials: false
      - run: echo "FORGE_DECISION_PACKAGE=$GITHUB_WORKSPACE/_decisions/packages/repair-acceptance" >> "$GITHUB_ENV"
      - id: requirements
        run: |
          set -euo pipefail
          reference="$(node factory/cli.mjs assemble | jq -er '.packages.skills')"
          [[ "$reference" =~ ^richgo/forge-kit-skills/packages/requirements#[0-9a-f]{40}$ ]]
          printf 'reference=%s\npin=%s\n' "$reference" "${reference##*#}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: richgo/forge-kit-skills
          ref: ${{ steps.requirements.outputs.pin }}
          path: _requirements
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bootstrap-delivery
          path: out/
      - run: |
          node factory/cli.mjs verify out/clean
          node factory/cli.mjs verify out/repaired
          inputs="$(mktemp -d)"
          cp examples/requirements.json test/fixtures/delegated/architecture.json test/fixtures/delegated/architecture.c4 "$inputs/"
          node factory/cli.mjs verify out/delegated --inputs "$inputs"
      - name: Replay the story and check the APMX verification report
        env:
          FORGE_REQUIREMENTS_PACKAGE: _requirements/packages/requirements
        run: |
          set -euo pipefail
          inputs="$(mktemp -d)"
          cp examples/product-requirements.json test/fixtures/delegated/architecture.json test/fixtures/delegated/architecture.c4 "$inputs/"
          node factory/cli.mjs requirements-evidence out/story --inputs "$inputs" --story STORY-001 > out/story/requirements-verification.json
          cp "$inputs/product-requirements.json" out/story/
          (cd out/story && node ../../_requirements/packages/requirements/checks/apmx-requirements-check.mjs)
          for file in product-requirements.json plan.json receipt.json deployed.mjs; do
            cmp "out/story/$file" "examples/apmx-story/$file"
          done
      - name: Resolve the external contract in APMX
        env:
          REQUIREMENTS_REFERENCE: ${{ steps.requirements.outputs.reference }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 2 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/danielmeppiel/apmx/releases/assets/699962963?download=1' -o "$scratch/apmx.tar.gz"
          printf '%s  %s\n' '524027362fe88728836ec6476d2c828d26b750d2067809c5741f27d950b93778' "$scratch/apmx.tar.gz" | sha256sum --check
          tar -xzf "$scratch/apmx.tar.gz" -C "$scratch"
          apmx="$(find "$scratch" -type f -name apmx -print -quit)"
          mkdir "$scratch/copilot"
          package="$(npm pack --ignore-scripts --silent --pack-destination "$scratch" @github/copilot-linux-x64@1.0.107)"
          tar -xzf "$scratch/$package" -C "$scratch/copilot"
          export PATH="$scratch/copilot/package:$PATH"
          mkdir "$scratch/workspace"
          cp out/story/{product-requirements.json,plan.json,receipt.json,deployed.mjs} "$scratch/workspace/"
          cd "$scratch/workspace"
          "$apmx" --from "$REQUIREMENTS_REFERENCE" --plan
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-requirements-trace
          path: out/story/requirements-verification.json
          if-no-files-found: error
      - name: Package the independently checked Pages releases
        env:
          FORGE_REQUIREMENTS_PACKAGE: _requirements/packages/requirements
        run: |
          set -euo pipefail
          inputs="$(mktemp -d)"
          cp examples/pages-candidate/product-requirements.json test/fixtures/delegated/architecture.json test/fixtures/delegated/architecture.c4 "$inputs/"
          node factory/cli.mjs requirements-evidence out/pages-candidate --inputs "$inputs" --story STORY-001 > out/pages-candidate/requirements-verification.json
          cp "$inputs/product-requirements.json" out/pages-candidate/
          (cd out/pages-candidate && node ../../_requirements/packages/requirements/checks/apmx-requirements-check.mjs)
          mkdir pages proof
          node factory/pages.mjs package out/story pages/baseline "$GITHUB_SHA"
          node factory/pages.mjs package out/pages-candidate pages/candidate "$GITHUB_SHA"
          cp pages/baseline/release.json proof/baseline.json
          cp pages/candidate/release.json proof/candidate.json
          [[ "$(jq -er '.release' proof/baseline.json)" != "$(jq -er '.release' proof/candidate.json)" ]]
      - if: github.event_name == 'workflow_dispatch' && github.repository != 'richgo/forge-kit' && inputs.pages_drill && (github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pages-proof
          path: proof/
          if-no-files-found: error
      - if: github.event_name == 'workflow_dispatch' && github.repository != 'richgo/forge-kit' && inputs.pages_drill && (github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: pages-baseline
          path: pages/baseline
      - if: github.event_name == 'workflow_dispatch' && github.repository != 'richgo/forge-kit' && inputs.pages_drill && (github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: pages-candidate
          path: pages/candidate
      - if: github.event_name == 'workflow_dispatch' && github.repository != 'richgo/forge-kit' && inputs.pages_drill && (github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: pages-rollback
          path: pages/baseline

  pages:
    name: Publish, probe, and roll back on GitHub Pages
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.repository != 'richgo/forge-kit' && inputs.pages_drill && (github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.baseline.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pages-proof
          path: proof
      - id: baseline
        name: Publish the known-good baseline
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: pages-baseline
          timeout: 240000
      - id: baseline_probe
        name: Observe the baseline at the hosted URL
        env:
          PAGE_URL: ${{ steps.baseline.outputs.page_url }}
        run: node factory/pages.mjs probe "$PAGE_URL" proof/baseline.json > proof/observed-baseline.json
      - id: candidate
        if: ${{ !inputs.pages_restore_only }}
        name: Publish the candidate
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: pages-candidate
          timeout: 240000
      - name: Observe the distinct candidate at the hosted URL
        if: ${{ !inputs.pages_restore_only }}
        env:
          PAGE_URL: ${{ steps.candidate.outputs.page_url }}
        run: node factory/pages.mjs probe "$PAGE_URL" proof/candidate.json > proof/observed-candidate.json
      - id: rollback
        if: ${{ !cancelled() && !inputs.pages_restore_only && steps.baseline_probe.outcome == 'success' }}
        name: Redeploy the identical baseline bytes
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: pages-rollback
          timeout: 240000
      - if: ${{ !cancelled() && steps.rollback.outcome == 'success' }}
        name: Verify rollback at the hosted URL
        env:
          PAGE_URL: ${{ steps.rollback.outputs.page_url }}
        run: node factory/pages.mjs probe "$PAGE_URL" proof/baseline.json > proof/observed-rollback.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hosted-release-evidence
          path: proof/
          if-no-files-found: error
