name: Qualify APMX language consumers

# Explicit dispatch only: each run invokes a real hosted agent and may incur cost.
# This workflow never publishes or deploys the candidate patch.
on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Reviewed application fixture to qualify
        required: true
        type: choice
        options:
          - python-api
          - go-service
          - typescript-web

permissions: {}

jobs:
  python:
    name: Python APMX build and independent replay
    if: inputs.consumer == 'python-api'
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: examples/consumers/python-api
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  go:
    name: Go APMX build and independent replay
    if: inputs.consumer == 'go-service'
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: examples/consumers/go-service
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  typescript:
    name: TypeScript APMX build and independent replay
    if: inputs.consumer == 'typescript-web'
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: examples/consumers/typescript-web
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
