name: Qualify APMX language consumers

# Explicit dispatch only: each run invokes a real hosted agent and may incur cost.
# This workflow never publishes or deploys the candidate patch.
on:
  workflow_dispatch:
    inputs:
      consumer:
        description: Reviewed application fixture to qualify
        required: true
        type: choice
        options:
          - python-api
          - go-service
          - typescript-web

permissions: {}

jobs:
  python:
    name: Python APMX build and independent replay
    if: inputs.consumer == 'python-api'
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: examples/consumers/python-api
      request: >-
        Implement the approved request.md for the Python quote API.
        Update src/quote.py only. Preserve the independent tests and
        .forge/verify-change. Apply nonnegative discounts, clamp totals
        at zero, and preserve invalid-input behavior.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  go:
    name: Go APMX build and independent replay
    if: inputs.consumer == 'go-service'
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: examples/consumers/go-service
      request: >-
        Implement the approved request.md for the Go quote service.
        Update src/quote.go only. Preserve the independent tests and
        .forge/verify-change. Apply nonnegative discounts, clamp totals
        at zero, and preserve negative-input errors.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  typescript:
    name: TypeScript APMX build and independent replay
    if: inputs.consumer == 'typescript-web'
    uses: ./.github/workflows/apmx-factory.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      workspace: examples/consumers/typescript-web
      request: >-
        Implement the approved request.md for the TypeScript price
        calculator. Update src/quote.ts only. Preserve independent tests
        and .forge/verify-change. Apply nonnegative discounts, clamp
        totals at zero, and reject invalid inputs.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
