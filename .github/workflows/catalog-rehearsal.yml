name: Catalog reference rehearsal

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' || github.ref == vars.FORGE_REHEARSAL_REF
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the Copilot credential
        env:
          HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_COPILOT_TOKEN" != 'true' ]; then
            echo '::error::Configure COPILOT_GITHUB_TOKEN for the reference rehearsal.'
            exit 1
          fi

  reference:
    needs: preflight
    uses: richgo/forge-kit-skills/.github/workflows/forge-reference.lock.yml@fbfd04889bd59a1afeddd03e2d73880ff3579d1b
    permissions:
      contents: read
      actions: read
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
