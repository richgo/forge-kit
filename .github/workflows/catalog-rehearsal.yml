name: Catalog reference rehearsal

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the Copilot credential
        env:
          HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_COPILOT_TOKEN" != 'true' ]; then
            echo '::error::Configure COPILOT_GITHUB_TOKEN for the reference rehearsal.'
            exit 1
          fi

  reference:
    needs: preflight
    uses: richgo/forge-kit-skills/.github/workflows/forge-reference.lock.yml@2ad068c4e1b2abe9b7dda65f5e8dab4835213558
    permissions:
      contents: read
      actions: read
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
