name: Observe verified Pages release

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-runtime-observation
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main' && vars.FORGE_RUNTIME_CANDIDATE_RUN == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Observe configured verified release
        env:
          FORGE_PAGES_URL: ${{ vars.FORGE_PAGES_URL }}
          FORGE_EXPECTED_RELEASE: ${{ vars.FORGE_EXPECTED_RELEASE }}
          FORGE_EXPECTED_INDEX_SHA256: ${{ vars.FORGE_EXPECTED_INDEX_SHA256 }}
          FORGE_EXPECTED_SOURCE: ${{ vars.FORGE_EXPECTED_SOURCE }}
          FORGE_MONITOR_OUTPUT: ${{ runner.temp }}/runtime-observation.json
        run: node factory/monitor-cli.mjs
      - name: Preserve observations for incident review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-observation
          path: ${{ runner.temp }}/runtime-observation.json
          if-no-files-found: ignore
          retention-days: 90
