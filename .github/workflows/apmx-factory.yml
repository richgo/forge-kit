name: APMX software factory

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Project directory containing the reviewed request.md, product-requirements.md and .forge/verify-change
        default: "."
        type: string
  workflow_call:
    inputs:
      workspace:
        description: Project directory containing the reviewed request.md, product-requirements.md and .forge/verify-change
        default: "."
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions: {}

jobs:
  run:
    name: Produce, independently check and sign the change
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: danielmeppiel/apmx/.github/workflows/run.yml@fae2067a0dc6ff07beda714015ff9e648f41ce63 # v0.8.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      factory: richgo/forge-kit-skills/packages/software-factory#40a7a6b54ce5603f450e4935beb9dac4f466b95a
      workspace: ${{ inputs.workspace }}
      apmx-version: "0.8.0"
      apmx-ref: fae2067a0dc6ff07beda714015ff9e648f41ce63
      attest: true
    secrets:
      agent-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
