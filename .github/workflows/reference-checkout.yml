name: ForgeKit reference checkout
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: richgo/forge-kit-skills
          ref: 89eed7bdb145e8ec64ba08091968558cfee97daa
          path: catalog
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - run: npm --prefix toolchain/openspec ci --ignore-scripts --engine-strict
      - uses: danielmeppiel/apmx/.github/actions/setup@fae2067a0dc6ff07beda714015ff9e648f41ce63
        with:
          version: '0.8.0'
          sha256: 524027362fe88728836ec6476d2c828d26b750d2067809c5741f27d950b93778
      - name: Install the pinned Copilot harness
        run: |
          mkdir "$RUNNER_TEMP/copilot"
          archive=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP" @github/copilot-linux-x64@1.0.107)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/copilot"
          echo "$RUNNER_TEMP/copilot/package" >> "$GITHUB_PATH"
      - name: Exercise contract, specification and topology gates
        env:
          FORGE_OPENSPEC_TOOL: ${{ github.workspace }}/toolchain/openspec/node_modules/@fission-ai/openspec/bin/openspec.js
          FORGE_ARCHITECTURE_PACKAGE: ${{ github.workspace }}/catalog/packages/architecture
        run: |
          export FORGE_REFERENCE_APMX="$(command -v apmx)"
          export FORGE_REFERENCE_EVIDENCE="$RUNNER_TEMP/reference-evidence/receipts"
          mkdir -p "$RUNNER_TEMP/reference-evidence"
          node --test test/openspec.test.mjs test/blueprint-init.test.mjs test/product-change.test.mjs test/apmx-evidence.test.mjs
          set -o pipefail
          node examples/openspec-checkout/qualify.mjs | tee "$RUNNER_TEMP/reference-evidence/qualification.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkout-reference-evidence
          path: ${{ runner.temp }}/reference-evidence
          if-no-files-found: error
      - name: Replay the pinned GitHub targets
        env:
          FORGE_OPENSPEC_TOOL: ${{ github.workspace }}/toolchain/openspec/node_modules/@fission-ai/openspec/bin/openspec.js
          FORGE_ARCHITECTURE_PACKAGE: ${{ github.workspace }}/catalog/packages/architecture
          FORGE_REFERENCE_HOSTED_PLAN: examples/openspec-checkout/hosted/plan.json
        run: |
          export FORGE_REFERENCE_APMX="$(command -v apmx)"
          export FORGE_REFERENCE_EVIDENCE="$RUNNER_TEMP/hosted-replay/receipts"
          mkdir -p "$RUNNER_TEMP/hosted-replay"
          set -o pipefail
          node examples/openspec-checkout/qualify.mjs | tee "$RUNNER_TEMP/hosted-replay/qualification.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-checkout-replay
          path: ${{ runner.temp }}/hosted-replay
          if-no-files-found: error

  sign-hosted-replay:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: hosted-checkout-replay
          path: ${{ runner.temp }}/hosted-replay
      - name: Sign the system qualification and independent unit receipts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ runner.temp }}/hosted-replay/qualification.jsonl
            ${{ runner.temp }}/hosted-replay/receipts/*/receipt.intoto.jsonl
