name: Forge Factory E2E

on:
  workflow_dispatch:
    inputs:
      website_release:
        description: Release the tracked Trail Desk product requirements
        type: choice
        options: [current]
        default: current
      publish_pages:
        description: Publish and observe the verified product on GitHub Pages
        type: boolean
        default: false
      qualify_worker_only:
        description: Check the pinned worker directly without GH-AW or Pages
        type: boolean
        default: false
      rollback_run_id:
        description: Successful main release run whose signed archive is still active
        type: string
        default: ''
      allow_publish_without_rollback:
        description: Break glass to publish without a verified rollback release
        type: boolean
        default: false


permissions: {}

jobs:
  factory:
    name: Run the agentic factory
    if: ${{ (github.ref == 'refs/heads/main' || (!inputs.publish_pages && github.actor == github.repository_owner)) && inputs.website_release == 'current' && !inputs.qualify_worker_only }}
    uses: richgo/forge-kit-skills/.github/workflows/forge-factory.lock.yml@40a7a6b54ce5603f450e4935beb9dac4f466b95a
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      pages: write
      pull-requests: read
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  worker:
    name: Qualify the pinned worker without publication
    if: ${{ inputs.qualify_worker_only && !inputs.publish_pages && github.actor == github.repository_owner && inputs.website_release == 'current' }}
    uses: richgo/forge-kit-skills/.github/workflows/forge-factory-worker.yml@40a7a6b54ce5603f450e4935beb9dac4f466b95a
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      pages: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  result:
    name: Require independently checked release evidence
    needs: [factory, worker]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require the factory to have completed
        env:
          FACTORY_RESULT: ${{ inputs.qualify_worker_only && needs.worker.result || needs.factory.result }}
        run: test "$FACTORY_RESULT" = success
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-verified
          path: verified
      - name: Require browser acceptance and the APMX receipt
        run: |
          set -euo pipefail
          test -s verified/requirements-verification.json
          test -s verified/receipt.intoto.jsonl
          test -s verified/browser-evidence.json
          test -s verified/security-verification.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-release-proof
          path: proof
      - name: Require successful release signature verification
        run: test -s proof/verified-signature.json && test -s proof/release.json
      - if: inputs.publish_pages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: factory-pages-observation
          path: observed
      - if: inputs.publish_pages
        run: jq -e '.observed == "passed"' observed/observed.json
